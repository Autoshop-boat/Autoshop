<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoShop — Online Store</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f6;color:#16211e}header{background:#087653;color:#fff;padding:22px 30px 54px;position:sticky;top:0;z-index:2}.logo{font-size:30px;font-weight:800}.tag{font-size:16px;opacity:.92;margin-top:5px}.search{margin-top:28px;width:100%;padding:20px 22px;border:0;border-radius:22px;font-size:22px;outline:none}main{max-width:900px;margin:auto;padding:42px 30px 100px}h2{margin:10px 0 18px;font-size:30px}.cats{display:flex;gap:16px;overflow:auto;padding-bottom:12px}.cat{background:#fff;border:1px solid #dfe8e4;padding:14px 25px;border-radius:28px;white-space:nowrap;font-size:17px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card,.panel{background:#fff;border-radius:24px;padding:16px;box-shadow:0 4px 18px #0000000b}.pic{height:285px;border-radius:18px;background:linear-gradient(135deg,#dfeee8,#fff);display:flex;align-items:center;justify-content:center;font-size:55px}.name{font-weight:800;margin:18px 0 6px;font-size:21px;line-height:1.15}.price{font-size:23px;font-weight:800}.old{text-decoration:line-through;color:#89948f;font-size:13px;margin-left:6px}.deal{color:#08724f;font-size:16px;margin-top:8px}.btn{width:100%;border:0;background:#087653;color:white;padding:17px;border-radius:17px;font-weight:800;font-size:17px;margin-top:14px;cursor:pointer}.btn.secondary{background:#e7f2ee;color:#087653}.back{background:none;border:0;color:#0b6b4d;font-weight:700;padding:0;margin-bottom:12px}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #edf1ef}.hide{display:none}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:12px 8px 10px;z-index:3}nav button{background:none;border:0;font-size:15px;color:#52615b;min-width:70px}input,textarea,select{width:100%;padding:13px;border:1px solid #d7e1dd;border-radius:10px;margin:6px 0 10px;font-size:16px}.pay{display:flex;gap:10px}.pay label{flex:1;border:1px solid #d7e1dd;border-radius:12px;padding:13px;cursor:pointer}.pay input{width:auto;margin-right:7px}.badge{padding:6px 10px;border-radius:20px;background:#e7f2ee;color:#087653;font-size:13px;font-weight:700}.small{font-size:13px;color:#64716c}.success{padding:18px;border-radius:16px;background:#e7f2ee;color:#075f46;margin-bottom:14px}.error{padding:18px;border-radius:16px;background:#fdecec;color:#9a2222;margin-bottom:14px}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}.pic{height:210px}}@media(max-width:480px){main{padding-left:30px;padding-right:30px}.grid{gap:18px}.pic{height:220px}.card{padding:14px}.name{font-size:19px}}
</style></head><body>
<header><div class="logo">🛍️ AutoShop</div><div class="tag">Find Deals. Shop Smart. Save More.</div><input id="search" class="search" placeholder="কী কিনতে চান?" oninput="filterProducts()"></header>
<main>
<section id="home"><h2>🔥 Today's Best Deals</h2><div class="cats"><button class="cat" onclick="filterCategory('')">সব</button><button class="cat" onclick="filterCategory('Fashion')">Fashion</button><button class="cat" onclick="filterCategory('Shoes')">Shoes</button><button class="cat" onclick="filterCategory('Electronics')">Electronics</button><button class="cat" onclick="filterCategory('Home')">Home</button></div><div id="grid" class="grid"></div></section>
<section id="product" class="hide"><button class="back" onclick="show('home')">← Back</button><div id="productBox"></div></section>
<section id="cart" class="hide"><h2>🛒 My Cart</h2><div id="cartBox"></div></section>
<section id="checkout" class="hide"><h2>💳 Checkout</h2><div id="checkoutBox"></div></section>
<section id="orders" class="hide"><h2>📦 My Orders</h2><div id="ordersBox"></div></section>
<section id="admin" class="hide"><h2>⚙️ AutoShop Admin</h2><div id="adminBox"></div></section>
</main>
<nav><button onclick="show('home')">🏠<br>Home</button><button onclick="show('cart')">🛒<br>Cart</button><button onclick="show('orders')">📦<br>Orders</button><button onclick="show('admin')">⚙️<br>Admin</button></nav>
<script>
let products=[],cart=JSON.parse(localStorage.getItem('as_cart')||'[]'),activeCategory='';
const api=(url,opts={})=>fetch(url,opts).then(async r=>{let d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d});
function saveCart(){localStorage.setItem('as_cart',JSON.stringify(cart));}
function productCard(p){return `<div class="card"><div class="pic">${p.icon}</div><div class="name">${p.name}</div><div><span class="price">₹${p.price}</span><span class="old">₹${p.old}</span></div><div class="deal">Best Deal • ${Math.round((1-p.price/p.old)*100)}% OFF</div><button class="btn" onclick="openProduct(${p.id})">View Product</button></div>`}
function render(list=products){document.getElementById('grid').innerHTML=list.map(productCard).join('')||'<div class="panel">Product পাওয়া যায়নি।</div>'}
function filterProducts(){let q=document.getElementById('search').value.toLowerCase();render(products.filter(p=>(!activeCategory||p.cat===activeCategory)&&p.name.toLowerCase().includes(q)))}
function filterCategory(c){activeCategory=c;filterProducts()}
function show(id){['home','product','cart','checkout','orders','admin'].forEach(x=>document.getElementById(x).classList.add('hide'));document.getElementById(id).classList.remove('hide');if(id==='cart')renderCart();if(id==='checkout')renderCheckout();if(id==='orders')loadOrders();if(id==='admin')renderAdmin();scrollTo(0,0)}
function openProduct(id){let p=products.find(x=>x.id===id);document.getElementById('productBox').innerHTML=`<div class="panel"><div class="pic">${p.icon}</div><h2>${p.name}</h2><div><span class="price">₹${p.price}</span><span class="old">₹${p.old}</span></div><p>আজকের deal price • Supplier: ${p.shop}</p><button class="btn" onclick="addCart(${p.id})">🛒 Add to Cart</button><button class="btn" onclick="buyNow(${p.id})">⚡ Order Now</button></div>`;show('product')}
function addCart(id){cart.push(products.find(x=>x.id===id));saveCart();alert('Product Cart-এ যোগ হয়েছে।')}
function buyNow(id){cart=[products.find(x=>x.id===id)];saveCart();show('checkout')}
function total(){return cart.reduce((s,p)=>s+p.price,0)}
function renderCart(){if(!cart.length){document.getElementById('cartBox').innerHTML='<div class="panel">Cart এখন খালি।</div>';return}document.getElementById('cartBox').innerHTML='<div class="panel">'+cart.map(p=>`<div class="row"><span>${p.icon} ${p.name}</span><b>₹${p.price}</b></div>`).join('')+`<div class="row"><b>Total</b><b>₹${total()}</b></div><button class="btn" onclick="show('checkout')">Proceed to Checkout</button><button class="btn secondary" onclick="cart=[];saveCart();renderCart()">Clear Cart</button></div>`}
function renderCheckout(){if(!cart.length){document.getElementById('checkoutBox').innerHTML='<div class="panel">আগে Cart-এ product যোগ করুন।</div>';return}document.getElementById('checkoutBox').innerHTML=`<div class="panel"><div class="row"><span>Products</span><b>${cart.length} item</b></div><label>নাম</label><input id="custName" placeholder="আপনার নাম"><label>মোবাইল</label><input id="phone" inputmode="numeric" placeholder="10-digit mobile number"><label>Delivery Address</label><textarea id="address" rows="3" placeholder="আপনার সম্পূর্ণ ঠিকানা"></textarea><label>Payment Method</label><div class="pay"><label><input type="radio" name="pay" value="COD" checked> Cash on Delivery</label><label><input type="radio" name="pay" value="ONLINE"> Online Payment</label></div><div class="small">Online Payment এখনো চালু হয়নি। Real gateway merchant setup পরের ধাপ।</div><div class="row"><b>Total</b><b>₹${total()}</b></div><button class="btn" onclick="placeOrder()">Place Order</button></div>`}
async function placeOrder(){let name=document.getElementById('custName').value.trim(),phone=document.getElementById('phone').value.trim(),address=document.getElementById('address').value.trim(),pay=document.querySelector('input[name="pay"]:checked')?.value;if(!name||!phone||!address)return alert('Name, mobile এবং address দিন।');if(!/^[0-9]{10}$/.test(phone))return alert('10 digit mobile number দিন।');if(pay!=='COD')return alert('এই version-এ Cash on Delivery select করুন।');try{let d=await api('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,phone,address,payment:'Cash on Delivery',items:cart})});localStorage.setItem('as_customer_token',d.customerToken);cart=[];saveCart();document.getElementById('checkoutBox').innerHTML=`<div class="success"><b>✅ Order Successfully Placed!</b><br>Order ID: <b>#${d.order.id}</b><br>এই order এখন online server-এ save হয়েছে।</div><button class="btn" onclick="show('orders')">📦 View My Orders</button>`;show('checkout')}catch(e){document.getElementById('checkoutBox').insertAdjacentHTML('afterbegin',`<div class="error">${e.message}</div>`)}}
async function loadOrders(){let box=document.getElementById('ordersBox'),t=localStorage.getItem('as_customer_token');if(!t){box.innerHTML='<div class="panel">এই browser-এ কোনো online order session নেই। নতুন order করলে এখানে দেখা যাবে।</div>';return}try{let os=await api('/api/orders',{headers:{'x-customer-token':t}});if(!os.length){box.innerHTML='<div class="panel">কোনো order পাওয়া যায়নি।</div>';return}box.innerHTML=os.map(o=>`<div class="panel"><div class="row"><b>Order #${o.id}</b><span class="badge">${o.status}</span></div><p>${o.items.map(x=>x.name).join(', ')}</p><div class="row"><span>Total</span><b>₹${o.total}</b></div><p>Payment: ${o.payment}<br>Supplier: ${o.supplier}<br>Delivery: ${o.delivery}</p><div class="small">${new Date(o.createdAt).toLocaleString()}</div></div>`).join('')}catch(e){box.innerHTML=`<div class="error">${e.message}</div>`}}
async function renderAdmin(){let box=document.getElementById('adminBox'),key=localStorage.getItem('as_admin_key');if(!key){box.innerHTML='<div class="panel"><p>Admin panel খুলতে Admin Key দিন।</p><input id="adminKey" type="password" placeholder="Admin Key"><button class="btn" onclick="loginAdmin()">Login</button><div class="small">Server-এ ADMIN_KEY environment variable সেট করতে হবে।</div></div>';return}try{let os=await api('/api/admin/orders',{headers:{'x-admin-key':key}});let sales=os.reduce((s,o)=>s+o.total,0);box.innerHTML=`<div class="panel"><div class="row"><span>Total Orders</span><b>${os.length}</b></div><div class="row"><span>Total Sales</span><b>₹${sales}</b></div></div>`+(os.length?os.map(o=>`<div class="panel"><div class="row"><b>#${o.id}</b><span class="badge">${o.status}</span></div><p>${o.name} • ${o.phone}<br>${o.items.map(x=>x.name).join(', ')}</p><button class="btn" onclick="advanceOrder('${o.id}')">Advance Status</button></div>`).join(''):'<div class="panel">No orders yet.</div>')}catch(e){localStorage.removeItem('as_admin_key');box.innerHTML=`<div class="error">${e.message}</div>`}}
function loginAdmin(){let k=document.getElementById('adminKey').value.trim();if(!k)return;localStorage.setItem('as_admin_key',k);renderAdmin()}
async function advanceOrder(id){let k=localStorage.getItem('as_admin_key');try{await api('/api/admin/orders/'+id+'/advance',{method:'POST',headers:{'x-admin-key':k}});renderAdmin();loadOrders()}catch(e){alert(e.message)}}
api('/api/products').then(d=>{products=d;render()}).catch(e=>document.getElementById('grid').innerHTML=`<div class="error">Server connection failed: ${e.message}</div>`);
</script></body></html>
